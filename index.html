<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>時間割</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: sans-serif;
            background: #fafafa;
        }

        h1, h3 {
            text-align: center;
            margin: 8px 0;
        }

        h1 {
            font-size: 22px;
        }

        h3 {
            font-size: 12px;
            font-weight: normal;
            color: #555;
            line-height: 1.5;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid #eeeeee;
            padding: 2px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: #f5f5f5;
            font-size: 12px;
            word-break: keep-all;
        }

        .period-cell {
            width: 52px;
        }

        .cell-box {
            position: relative;
            width: 100%;
            min-height: 76px;
        }

        .subject-btn {
            width: 100%;
            height: 76px;
            font-size: 10px;
            cursor: pointer;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.15;
            border: 1px solid #eeeeee;
            border-radius: 6px;
            background-color: #ffffff;
            transition: background-color 0.2s, transform 0.05s;
            -webkit-appearance: none;
            appearance: none;
            padding: 18px 4px 4px 4px;
            touch-action: manipulation;
            color: #000;
        }

        .subject-btn:active,
        .edit-btn:active,
        .subject-select-btn:active,
        .close-picker:active,
        .action-btn:active,
        .close-action:active,
        .btn-clear-all:active {
            transform: scale(0.98);
        }

        .edit-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            border: 1px solid #aaa;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            z-index: 2;
            touch-action: manipulation;
        }

        .edit-btn:hover {
            background: #f0f0f0;
        }

        .hint {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            line-height: 1.5;
        }

        .danger-zone {
            text-align: center;
            margin-top: 14px;
        }

        .btn-clear-all {
            width: 100%;
            max-width: 260px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #d9534f;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-clear-all:hover {
            background: #c9302c;
        }

        .picker-overlay,
        .action-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .picker-box,
        .action-box {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .picker-box h2,
        .action-box h2 {
            margin: 0 0 12px 0;
            text-align: center;
            font-size: 18px;
        }

        .subject-list,
        .action-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .subject-select-btn,
        .action-btn {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            padding: 12px 8px;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 54px;
            color: #000;
            line-height: 1.3;
            word-break: break-word;
        }

        .action-btn.delete {
            background: #ffe5e5;
            border-color: #f5b5b5;
        }

        .close-picker,
        .close-action {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #666;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        @media screen and (min-width: 768px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 26px;
            }

            h3 {
                font-size: 14px;
            }

            th {
                font-size: 15px;
            }

            .period-cell {
                width: 70px;
            }

            .cell-box {
                min-height: 84px;
            }

            .subject-btn {
                height: 84px;
                font-size: 13px;
                padding: 20px 6px 6px 6px;
            }

            .edit-btn {
                width: 24px;
                height: 24px;
                font-size: 13px;
            }

            .hint {
                font-size: 12px;
            }

            .picker-box h2,
            .action-box h2 {
                font-size: 20px;
            }

            .subject-select-btn,
            .action-btn,
            .close-picker,
            .close-action,
            .btn-clear-all {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <h1>時間割</h1>
    <h3>
        タップ：出欠確認 / 新規登録<br>
        右上の ✎：授業名の変更・削除
    </h3>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th class="period-cell">時間<br>/曜日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th class="period-cell">1限<br>2限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-1" type="button">✎</button><input type="button" id="mon-1" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-1" type="button">✎</button><input type="button" id="tue-1" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-1" type="button">✎</button><input type="button" id="wed-1" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-1" type="button">✎</button><input type="button" id="thu-1" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-1" type="button">✎</button><input type="button" id="fri-1" class="subject-btn" value=""></div></td>
                </tr>
                <tr>
                    <th class="period-cell">3限<br>4限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-2" type="button">✎</button><input type="button" id="mon-2" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-2" type="button">✎</button><input type="button" id="tue-2" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-2" type="button">✎</button><input type="button" id="wed-2" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-2" type="button">✎</button><input type="button" id="thu-2" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-2" type="button">✎</button><input type="button" id="fri-2" class="subject-btn" value=""></div></td>
                </tr>
                <tr>
                    <th class="period-cell">5限<br>6限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-3" type="button">✎</button><input type="button" id="mon-3" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-3" type="button">✎</button><input type="button" id="tue-3" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-3" type="button">✎</button><input type="button" id="wed-3" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-3" type="button">✎</button><input type="button" id="thu-3" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-3" type="button">✎</button><input type="button" id="fri-3" class="subject-btn" value=""></div></td>
                </tr>
                <tr>
                    <th class="period-cell">7限<br>8限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-4" type="button">✎</button><input type="button" id="mon-4" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-4" type="button">✎</button><input type="button" id="tue-4" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-4" type="button">✎</button><input type="button" id="wed-4" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-4" type="button">✎</button><input type="button" id="thu-4" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-4" type="button">✎</button><input type="button" id="fri-4" class="subject-btn" value=""></div></td>
                </tr>
                <tr>
                    <th class="period-cell">9限<br>10限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-5" type="button">✎</button><input type="button" id="mon-5" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-5" type="button">✎</button><input type="button" id="tue-5" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-5" type="button">✎</button><input type="button" id="wed-5" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-5" type="button">✎</button><input type="button" id="thu-5" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-5" type="button">✎</button><input type="button" id="fri-5" class="subject-btn" value=""></div></td>
                </tr>
                <tr>
                    <th class="period-cell">11限<br>12限</th>
                    <td><div class="cell-box"><button class="edit-btn" data-id="mon-6" type="button">✎</button><input type="button" id="mon-6" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="tue-6" type="button">✎</button><input type="button" id="tue-6" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="wed-6" type="button">✎</button><input type="button" id="wed-6" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="thu-6" type="button">✎</button><input type="button" id="thu-6" class="subject-btn" value=""></div></td>
                    <td><div class="cell-box"><button class="edit-btn" data-id="fri-6" type="button">✎</button><input type="button" id="fri-6" class="subject-btn" value=""></div></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="hint">
        ※ コマ本体を押すと出欠詳細を開きます<br>
        ※ 空欄なら授業を登録できます<br>
        ※ ✎ ボタンで授業名の変更・削除ができます
    </div>

    <div class="danger-zone">
        <button type="button" class="btn-clear-all" onclick="clearAllSubjects()">
            時間割を一括削除
        </button>
    </div>

    <div id="subject-picker" class="picker-overlay">
        <div class="picker-box">
            <h2 id="picker-title">授業を選択</h2>
            <div id="subject-list" class="subject-list"></div>
            <button type="button" class="close-picker" onclick="closeSubjectPicker()">キャンセル</button>
        </div>
    </div>

    <div id="action-menu" class="action-overlay">
        <div class="action-box">
            <h2 id="action-title">操作を選択</h2>
            <div class="action-list">
                <button type="button" class="action-btn" onclick="changeSubjectFromMenu()">授業を変更</button>
                <button type="button" class="action-btn delete" onclick="deleteSubjectFromMenu()">削除</button>
            </div>
            <button type="button" class="close-action" onclick="closeActionMenu()">キャンセル</button>
        </div>
    </div>

    <script>
        const colorPalette = [
            '#e1f5fe', '#f3e5f5', '#efebe9', '#e8f5e9', '#fff3e0',
            '#fce4ec', '#f0f4c3', '#e0f2f1', '#e8eaf6', '#ede7f6',
            '#afeeee', '#f8f8ff'
        ];

        const subjectData = {
            '国語': ['現代の国語', '言語文化', '論理国語', '文学国語', '古典探求', '現代文（入試演習）', '古典（入試演習）', '小論文演習'],
            '数学': ['数学Ⅰ', '数学A', '数学Ⅱ', '数学B', '数学Ⅲ', '数学C', '数学Ⅰ（入試演習）', '数学Ⅱ（入試演習）', '数学発展演習'],
            '英語': ['英語コミュニケーションⅠ', '英語コミュニケーションⅡ', '論理・表現Ⅰ', '論理・表現Ⅱ', '論理・表現Ⅲ', '総合英語Ⅰ', 'フランス語'],
            '理科': ['物理基礎', '化学基礎', '生物基礎', '地学基礎', '物理', '化学', '生物', '地学', '物理演習', '化学演習', '生物演習', '地学演習'],
            '社会': ['歴史総合', '地理総合', '日本史探求', '世界史探求', '公共', '倫理', '政治・経済'],
            '情報': ['情報Ⅰ', '情報Ⅱ', '情報産業と社会', '情報の表現と管理', '情報デザイン', 'プログラミング基礎', '情報基礎実習', '情報テクノロジー', '情報セキュリティ', '情報システムのプログラミング', 'ネットワークシステム', 'データベース', 'コンテンツの制作と発信', 'コンピューターグラフィックス', '情報コンテンツ実習', 'メディアとサ－ビス', '情報実習', '課題研究', '課題研究（発展）'],
            '体育': ['体育館', 'テニス', '水泳', '卓球', 'ダンス', '武道', 'ストレッチ'],
            '保健': ['保健α', '保健β'],
            '音楽': ['音楽Ⅰ', '音楽Ⅱ'],
            '美術': ['美術Ⅰ', '美術Ⅱ'],
            '工芸': ['工芸Ⅰ', '工芸Ⅱ'],
            '書道': ['書道Ⅰ', '書道Ⅱ'],
            '家庭科': ['家庭総合α', '家庭総合β', 'ファッション造形基礎', 'フードデザイン'],
            'ホームルーム': ['ホームルーム']
        };

        let currentTargetId = null;
        let actionTargetId = null;

        function getSubjectColor(subjectName) {
            if (!subjectName) return '#ffffff';
            let hash = 0;
            for (let i = 0; i < subjectName.length; i++) {
                hash = subjectName.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % colorPalette.length;
            return colorPalette[index];
        }

        function clicked(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                openSubjectPicker(id);
            } else {
                const pageUrl = `attendance.html?subject=${encodeURIComponent(savedName)}`;
                window.location.href = pageUrl;
            }
        }

        function editCell(id) {
            const savedName = localStorage.getItem(id) || '';

            if (!savedName) {
                openSubjectPicker(id);
                return;
            }

            actionTargetId = id;
            document.getElementById('action-title').textContent = `【${savedName}】の操作`;
            document.getElementById('action-menu').style.display = 'flex';
        }

        function closeActionMenu() {
            document.getElementById('action-menu').style.display = 'none';
            actionTargetId = null;
        }

        function changeSubjectFromMenu() {
            if (!actionTargetId) return;
            const targetId = actionTargetId;
            closeActionMenu();
            openSubjectPicker(targetId);
        }

        function deleteSubjectFromMenu() {
            if (!actionTargetId) return;

            const savedName = localStorage.getItem(actionTargetId) || '';
            if (!savedName) {
                closeActionMenu();
                return;
            }

            if (confirm(`【${savedName}】を削除しますか？`)) {
                localStorage.removeItem(actionTargetId);
                localStorage.removeItem(`att-absent-${savedName}`);
                localStorage.removeItem(`att-detail-absent-${savedName}`);
                localStorage.removeItem(`att-detail-plus-${savedName}`);
                localStorage.removeItem(`att-detail-minus-${savedName}`);
                refreshAllButtons();
            }

            closeActionMenu();
        }

        function clearAllSubjects() {
            if (!confirm('時間割に登録された授業と出欠記録をすべて削除しますか？')) {
                return;
            }

            document.querySelectorAll('.subject-btn').forEach((btn) => {
                const subjectName = localStorage.getItem(btn.id);

                if (subjectName) {
                    localStorage.removeItem(`att-absent-${subjectName}`);
                    localStorage.removeItem(`att-detail-absent-${subjectName}`);
                    localStorage.removeItem(`att-detail-plus-${subjectName}`);
                    localStorage.removeItem(`att-detail-minus-${subjectName}`);
                }

                localStorage.removeItem(btn.id);
            });

            refreshAllButtons();
            alert('時間割をすべて削除しました。');
        }

        function openSubjectPicker(id) {
            currentTargetId = id;
            showMainSubjects();
            document.getElementById('subject-picker').style.display = 'flex';
        }

        function closeSubjectPicker() {
            document.getElementById('subject-picker').style.display = 'none';
            currentTargetId = null;
        }

        function showMainSubjects() {
            const listArea = document.getElementById('subject-list');
            const title = document.getElementById('picker-title');

            title.textContent = '教科を選択';
            listArea.innerHTML = '';

            Object.keys(subjectData).forEach((subject) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'subject-select-btn';
                btn.textContent = subject;
                btn.style.backgroundColor = getSubjectColor(subject);

                btn.addEventListener('click', () => {
                    const childList = subjectData[subject];

                    if (Array.isArray(childList) && childList.length > 0) {
                        showSubSubjects(subject);
                    } else {
                        saveSubjectToCell(subject);
                    }
                });

                listArea.appendChild(btn);
            });
        }

        function showSubSubjects(parentSubject) {
            const listArea = document.getElementById('subject-list');
            const title = document.getElementById('picker-title');
            const childList = subjectData[parentSubject] || [];

            title.textContent = `${parentSubject} の授業を選択`;
            listArea.innerHTML = '';

            childList.forEach((subSubject) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'subject-select-btn';
                btn.textContent = subSubject;
                btn.style.backgroundColor = getSubjectColor(subSubject);

                btn.addEventListener('click', () => {
                    const fullName = `${parentSubject}／${subSubject}`;
                    saveSubjectToCell(fullName);
                });

                listArea.appendChild(btn);
            });

            const backBtn = document.createElement('button');
            backBtn.type = 'button';
            backBtn.className = 'subject-select-btn';
            backBtn.textContent = '← 戻る';
            backBtn.style.backgroundColor = '#eeeeee';

            backBtn.addEventListener('click', () => {
                showMainSubjects();
            });

            listArea.appendChild(backBtn);
        }

        function saveSubjectToCell(newName) {
            if (!currentTargetId) return;

            const oldName = localStorage.getItem(currentTargetId) || '';
            const oldAbsent = oldName ? localStorage.getItem(`att-absent-${oldName}`) : null;
            const oldDetailAbsent = oldName ? localStorage.getItem(`att-detail-absent-${oldName}`) : null;
            const oldDetailPlus = oldName ? localStorage.getItem(`att-detail-plus-${oldName}`) : null;
            const oldDetailMinus = oldName ? localStorage.getItem(`att-detail-minus-${oldName}`) : null;

            localStorage.setItem(currentTargetId, newName);

            if (oldName && oldName !== newName) {
                if (oldAbsent !== null) {
                    localStorage.setItem(`att-absent-${newName}`, oldAbsent);
                    localStorage.removeItem(`att-absent-${oldName}`);
                }
                if (oldDetailAbsent !== null) {
                    localStorage.setItem(`att-detail-absent-${newName}`, oldDetailAbsent);
                    localStorage.removeItem(`att-detail-absent-${oldName}`);
                }
                if (oldDetailPlus !== null) {
                    localStorage.setItem(`att-detail-plus-${newName}`, oldDetailPlus);
                    localStorage.removeItem(`att-detail-plus-${oldName}`);
                }
                if (oldDetailMinus !== null) {
                    localStorage.setItem(`att-detail-minus-${newName}`, oldDetailMinus);
                    localStorage.removeItem(`att-detail-minus-${oldName}`);
                }
            }

            closeSubjectPicker();
            refreshAllButtons();
        }

        function refreshAllButtons() {
            const isMobile = window.innerWidth <= 600;

            document.querySelectorAll(".subject-btn").forEach((btn) => {
                const subjectName = localStorage.getItem(btn.id);

                if (subjectName) {
                    const absentCount = localStorage.getItem(`att-absent-${subjectName}`) || 0;

                    btn.value = isMobile
                        ? `${subjectName}\n欠:${absentCount}`
                        : `${subjectName}\n(欠席:${absentCount}回)`;

                    btn.style.backgroundColor = getSubjectColor(subjectName);
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'bold';

                    if (parseInt(absentCount, 10) >= 10) {
                        btn.style.borderColor = '#ff0000';
                        btn.style.boxShadow = '0 0 6px rgba(255, 0, 0, 0.6)';
                    } else {
                        btn.style.borderColor = '#eeeeee';
                        btn.style.boxShadow = 'none';
                    }
                } else {
                    btn.value = '';
                    btn.style.backgroundColor = '#ffffff';
                    btn.style.borderColor = '#eeeeee';
                    btn.style.boxShadow = 'none';
                    btn.style.color = '#000';
                    btn.style.fontWeight = 'normal';
                }
            });
        }

        function initializeButtons() {
            document.querySelectorAll('.subject-btn').forEach((btn) => {
                btn.addEventListener('click', () => {
                    clicked(btn.id);
                });
            });

            document.querySelectorAll('.edit-btn').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editCell(btn.dataset.id);
                });
            });

            const picker = document.getElementById('subject-picker');
            picker.addEventListener('click', (e) => {
                if (e.target === picker) {
                    closeSubjectPicker();
                }
            });

            const actionMenu = document.getElementById('action-menu');
            actionMenu.addEventListener('click', (e) => {
                if (e.target === actionMenu) {
                    closeActionMenu();
                }
            });

            refreshAllButtons();
        }

        window.addEventListener("load", initializeButtons);
        window.addEventListener("focus", refreshAllButtons);
        window.addEventListener("resize", refreshAllButtons);
    </script>
</body>
</html>
