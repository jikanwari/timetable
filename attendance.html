<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>欠席カウンター</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 16px;
            text-align: center;
            background-color: #f9f9f9;
        }

        .top-actions {
            width: 100%;
            max-width: 420px;
            margin: 0 auto 12px auto;
            text-align: left;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 14px;
            background: #4a5568;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back:active {
            transform: scale(0.98);
        }

        .form-container {
            display: inline-block;
            width: 100%;
            max-width: 420px;
            text-align: left;
            border: 3px solid #dc3545;
            padding: 20px;
            border-radius: 12px;
            background-color: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
            border-bottom: 2px solid #dc3545;
            padding-bottom: 10px;
            text-align: center;
        }
        
        .total-box {
            text-align: center;
            margin: 20px 0;
            background: #fff5f5;
            border: 2px solid #feb2b2;
            padding: 15px;
            border-radius: 8px;
        }

        .total-label {
            font-size: 15px;
            color: #e53e3e;
            font-weight: bold;
        }

        .total-value {
            font-size: 42px;
            font-weight: bold;
            margin-top: 5px;
            color: #dc3545;
            word-break: break-word;
        }

        .total-unit {
            font-size: 20px;
            margin-left: 5px;
            color: #333;
        }

        .breakdown-grid {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .breakdown-card {
            flex: 1;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            min-width: 0;
        }

        .breakdown-label {
            font-size: 12px;
            color: #4a5568;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .breakdown-value {
            font-size: 24px;
            font-weight: bold;
            color: #2d3748;
        }

        .counter-section {
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #edf2f7;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #4a5568;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-add {
            flex: 2;
            padding: 12px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-sub {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            color: #4a5568;
            background-color: #edf2f7;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add:active,
        .btn-sub:active,
        .btn-reset:active {
            transform: scale(0.97);
        }
        
        .bg-absent {
            background-color: #dc3545;
            box-shadow: 0 3px #9b2c2c;
        }

        .bg-plus {
            background-color: #dd6b20;
            box-shadow: 0 3px #9c4221;
        }

        .bg-minus {
            background-color: #3182ce;
            box-shadow: 0 3px #2b6cb0;
        }

        .btn-reset {
            width: 100%;
            padding: 10px;
            background-color: #718096;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background-color: #4a5568;
        }

        @media screen and (max-width: 480px) {
            body {
                padding: 10px;
            }

            .form-container {
                padding: 16px;
            }

            h1 {
                font-size: 18px;
            }

            .breakdown-grid {
                gap: 6px;
            }

            .breakdown-label {
                font-size: 11px;
            }

            .breakdown-value {
                font-size: 20px;
            }

            .total-value {
                font-size: 34px;
            }

            .total-unit {
                font-size: 16px;
            }

            .btn-add {
                font-size: 16px;
                padding: 11px;
            }

            .btn-sub {
                font-size: 13px;
                padding: 11px;
            }

            .section-title {
                font-size: 13px;
            }

            .btn-back {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="top-actions">
        <button class="btn-back" onclick="goBackToTimetable()">← 時間割に戻る</button>
    </div>

    <div class="form-container">
        <h1 id="subject-title">授業出欠詳細管理</h1>
        
        <div class="breakdown-grid">
            <div class="breakdown-card">
                <div class="breakdown-label">欠席回数</div>
                <div id="val-absent" class="breakdown-value">0</div>
            </div>
            <div class="breakdown-card">
                <div class="breakdown-label">1時間加算</div>
                <div id="val-plus" class="breakdown-value">0</div>
            </div>
            <div class="breakdown-card">
                <div class="breakdown-label">1時間減算</div>
                <div id="val-minus" class="breakdown-value">0</div>
            </div>
        </div>

        <div class="total-box">
            <div class="total-label">合計欠席時間</div>
            <div class="total-value"><span id="total-hours">0</span><span class="total-unit">時間分</span></div>
        </div>

        <div class="counter-section">
            <div class="section-title">❌ 欠席（1回 ＝ 2時間分加算）</div>
            <div class="btn-group">
                <button class="btn-add bg-absent" onclick="changeCount('absent', 1)">欠席 +1</button>
                <button class="btn-sub" onclick="changeCount('absent', -1)">-1</button>
            </div>
        </div>

        <div class="counter-section">
            <div class="section-title">➕ 欠席1時間増やす</div>
            <div class="btn-group">
                <button class="btn-add bg-plus" onclick="changeCount('plus', 1)">1時間増やす +1</button>
                <button class="btn-sub" onclick="changeCount('plus', -1)">-1</button>
            </div>
        </div>

        <div class="counter-section">
            <div class="section-title">➖ 欠席1時間減らす</div>
            <div class="btn-group">
                <button class="btn-add bg-minus" onclick="changeCount('minus', 1)">1時間減らす +1</button>
                <button class="btn-sub" onclick="changeCount('minus', -1)">-1</button>
            </div>
        </div>

        <button class="btn-reset" onclick="resetAll()">全ての記録をリセット</button>
    </div>

    <script>
        let currentSubject = "";
        const HOURS_PER_ABSENT = 2;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const subjectName = urlParams.get('subject');

            if (subjectName) {
                currentSubject = subjectName;
                document.getElementById('subject-title').textContent = `${subjectName} 出欠詳細`;
                document.title = `${subjectName} - 出欠詳細カウンター`;
                updateDisplay();
            } else {
                document.getElementById('subject-title').textContent = '授業名未指定';
            }
        });

        function goBackToTimetable() {
            window.location.href = 'index.html';
        }

        function updateDisplay() {
            if (!currentSubject) return;

            const absent = parseInt(localStorage.getItem(`att-detail-absent-${currentSubject}`) || 0, 10);
            const plus = parseInt(localStorage.getItem(`att-detail-plus-${currentSubject}`) || 0, 10);
            const minus = parseInt(localStorage.getItem(`att-detail-minus-${currentSubject}`) || 0, 10);

            document.getElementById('val-absent').textContent = absent;
            document.getElementById('val-plus').textContent = plus;
            document.getElementById('val-minus').textContent = minus;

            const totalHours = Math.max(0, absent * HOURS_PER_ABSENT + plus - minus);
            document.getElementById('total-hours').textContent = totalHours;

            localStorage.setItem(`att-absent-${currentSubject}`, absent);
        }

        function changeCount(type, num) {
            if (!currentSubject) return;

            const key = `att-detail-${type}-${currentSubject}`;
            let currentCount = parseInt(localStorage.getItem(key) || 0, 10);

            currentCount = Math.max(0, currentCount + num);
            localStorage.setItem(key, currentCount);

            updateDisplay();
        }

        function resetAll() {
            if (!currentSubject) return;

            if (confirm(`【${currentSubject}】のすべての出欠記録をリセットしますか？`)) {
                localStorage.removeItem(`att-detail-absent-${currentSubject}`);
                localStorage.removeItem(`att-detail-plus-${currentSubject}`);
                localStorage.removeItem(`att-detail-minus-${currentSubject}`);
                localStorage.removeItem(`att-absent-${currentSubject}`);
                updateDisplay();
            }
        }
    </script>

</body>
</html>
